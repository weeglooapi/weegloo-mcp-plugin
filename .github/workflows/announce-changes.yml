name: Announce skill/rule changes

# When skills/rules change on a branch, generate a user-facing release announcement
# (10 languages) with Claude Code and publish it to Weegloo CMA as a Content entry.
#
# Pipeline:
#   1. checkout (full history — we diff before..after)
#   2. resolve the diff range for this push
#   3. Claude Code Action: follow .claude/agents/weegloo-announce.md → write announcement.json
#   4. post-announcement.mjs: wrap in the CMA payload envelope and POST
#      (skips automatically if the agent found no user-facing change)
#
# Release-only: fires on pushes to `latest` (the distribution branch) that touch the
# skills/rules the agent actually analyzes. Work-in-progress pushes to `develop` and
# feature branches do NOT announce — announcements go out when changes are released.
# (Note: unlike the installer-manifest workflow, this does NOT watch .mcp.json or the
# build script — the agent only reads skills/rules, so watching them would just cause
# no-op runs.)
#
# Loop safety: the bot's [skip ci] manifest commit uses the default GITHUB_TOKEN, whose
# pushes don't re-trigger workflows — so this fires on human pushes only.

on:
  push:
    branches:
      - latest
    paths:
      - 'plugins/weegloo/skills/**'
      - 'plugins/weegloo/rules/**'
  workflow_dispatch:

# Read-only: the job writes announcement.json into the runner workspace and POSTs it
# externally. It never commits or pushes, so contents:read is enough (and also blocks any
# accidental push attempt).
permissions:
  contents: read

concurrency:
  group: announce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    # Overall safety net. Without this the job would inherit GitHub's 6-hour default.
    # Kept above the Claude step's cap so the step's own timeout fires first.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # First push to a branch (no `before`) or manual dispatch: just the last commit.
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Generate announcement
        # The Claude run is the slow, variable step — cap it tighter than the whole job
        # so a stuck generation fails fast instead of eating the full job budget.
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read the file .claude/agents/weegloo-announce.md and follow it EXACTLY as your
            full instructions/system prompt. Then carry out the task with these inputs:
              BASE_SHA=${{ steps.range.outputs.base }}
              HEAD_SHA=${{ steps.range.outputs.head }}
              OUTPUT_PATH=announcement.json
            Write announcement.json at the repository root in the exact JSON Output format
            that file specifies, then stop. Do not commit, push, or modify anything else.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 30
            --allowedTools Bash,Read,Grep,Glob,Write

      - name: Post announcement to Weegloo
        env:
          WEEGLOO_CMA_TOKEN: ${{ secrets.WEEGLOO_CMA_TOKEN }}
        run: node scripts/post-announcement.mjs
