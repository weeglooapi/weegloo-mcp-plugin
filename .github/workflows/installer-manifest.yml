name: Regenerate installer manifest

# Branch-native distribution: whenever skills/rules/.mcp.json change on a
# DISTRIBUTABLE branch, regenerate plugins/weegloo/installer-manifest.json and commit
# it back to the same branch so `npx weegloo` (which reads that one file via raw)
# serves fresh content.
#
# Only distributable branches are auto-regenerated (see `branches:` below):
#   - latest                    — the default `npx weegloo` ref
#   - N.N.N                     — numeric version release branches (e.g. 1.0.12)
#   - develop                   — internal mainline
# The manifest embeds ALL skill/rule bodies + a content-hash `version` into ONE file,
# so every skill/rule change touches it. If CI regenerated it on feature/PR branches
# too, two concurrent skill/rule PRs would BOTH commit a manifest edit and collide on
# merge. Gating to distributable branches means only the target branch's own CI mutates
# the manifest — PR branches never touch it, so concurrent PRs never conflict on it, and
# each merge self-heals the manifest on the target. Feature branches that genuinely need
# a manifest (e.g. to test `npx weegloo --branch <feature>`) use workflow_dispatch below.
#
# Loop safety (no infinite re-trigger):
#   - the default GITHUB_TOKEN's commits do NOT trigger workflows (GitHub built-in)
#   - the manifest path is NOT in `paths`, so a manifest-only commit wouldn't match anyway
#   - `git diff --cached --quiet` makes a no-content-change run a no-op
# This workflow file must exist on every distributable branch (latest, version branches).

on:
  push:
    branches:
      - latest
      - develop
      - '[0-9]+.[0-9]+.[0-9]+'  # numeric version release branches (e.g. 1.0.12)
    paths:
      - 'plugins/weegloo/skills/**'
      - 'plugins/weegloo/rules/**'
      - 'plugins/weegloo/.mcp.json'
      - 'scripts/build-installer-manifest.mjs'
  # Manual re-run for a chosen branch (e.g. to backfill a stale manifest, or to seed a
  # manifest on a feature branch for `npx weegloo --branch <feature>` testing) without
  # pushing a throwaway commit. Runs the workflow file from the selected branch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build installer manifest
        run: node scripts/build-installer-manifest.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/weegloo/installer-manifest.json
          if git diff --cached --quiet; then
            echo "installer-manifest.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(manifest): regenerate installer-manifest.json [skip ci]"
          # Fully-qualify refs (refs/heads/) so a same-named tag never makes the ref
          # ambiguous — fetch/push always target the branch, never a tag.
          git pull --rebase origin "refs/heads/${{ github.ref_name }}"
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
